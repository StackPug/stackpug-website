<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Contact | StackPug website</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <header class="site-header">
        <nav class="main-nav">
            <input
                type="checkbox"
                id="menu-toggle"
            >
            <label
                for="menu-toggle"
                class="hamburger"
            >☰</label>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a
                        href="contact.html"
                        class="active"
                    >Contact</a></li>
                <li><a href="learning.html">Learning</a></li>
            </ul>
        </nav>
        <a
            href="index.html"
            title="Home"
            aria-label="Go to homepage"
        >
            <img
                src="./images/stackpug-s.png"
                alt="StackPug Home logo"
                class="logo"
            >

        </a>
    </header>

    <main class="page-content">
        <h2>Contact StackPug</h2>
        <section class="contact-section">
            <p>Have a question or want a website?<br>Send us a message.</p>

            <form
                action="https://formspree.io/f/mwpgnegr"
                method="POST"
                class="contact-form"
            >

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <div class="input-wrap">
                            <span class="icon">👤</span>
                            <input
                                id="name"
                                type="text"
                                name="name"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrap">
                            <span class="icon">✉️</span>
                            <input
                                id="email"
                                type="email"
                                name="email"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group full">
                        <label for="message">Message</label>
                        <div class="input-wrap">
                            <span class="icon">💬</span>
                            <textarea
                                id="message"
                                name="message"
                                rows="6"
                                required
                            ></textarea>
                        </div>
                    </div>

                </div>

                <!-- spam protection -->
                <input
                    type="text"
                    name="_gotcha"
                    style="display:none"
                >

                <!-- redirect after submit -->
                <input
                    type="hidden"
                    name="_next"
                    value="https://stackpug.netlify.app/thank-you.html"
                >
                <input
                    type="hidden"
                    name="_redirect"
                    value="https://stackpug.netlify.app/thank-you.html"
                >

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 StackPug | Web Design for Local Businesses. All rights reserved.</p>
    </footer>

</body>

</html>
